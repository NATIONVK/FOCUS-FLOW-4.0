name: Quality Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Avoid wasting runner minutes on outdated commits.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: npm install
      - run: npm test
      - name: Run Python build-tool tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Generate Python project health report
        run: python scripts/project_health.py --output reports
      - name: Upload project health report
        uses: actions/upload-artifact@v6
        with:
          name: focus-flow-project-health
          path: reports/project-health.*
          if-no-files-found: error
          retention-days: 14
      - run: npm run build
