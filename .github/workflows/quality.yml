name: Quality Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm install
      - run: npm test
      - name: Run Python build-tool tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Generate Python project health report
        run: python scripts/project_health.py --output reports
      - name: Upload project health report
        uses: actions/upload-artifact@v4
        with:
          name: focus-flow-project-health
          path: reports/project-health.*
          retention-days: 14
      - run: npm run build
