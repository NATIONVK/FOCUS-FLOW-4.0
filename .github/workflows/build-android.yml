name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify toolchain
        run: |
          java -version
          node --version
          npm --version
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Build web app
        run: npm run build
      - name: Add Android platform if absent
        run: |
          if [ ! -d android ]; then npx cap add android; fi
      - name: Install native gallery bridge
        run: |
          mkdir -p android/app/src/main/java/com/nationvk/focusflow
          cp native/android/GalleryPlugin.java android/app/src/main/java/com/nationvk/focusflow/GalleryPlugin.java
          cp native/android/FocusTimerPlugin.java android/app/src/main/java/com/nationvk/focusflow/FocusTimerPlugin.java
          cp native/android/FocusTimerService.java android/app/src/main/java/com/nationvk/focusflow/FocusTimerService.java
          cp native/android/MainActivity.java android/app/src/main/java/com/nationvk/focusflow/MainActivity.java
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />',
              '    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />',
              '    <uses-permission android:name="android.permission.READ_MEDIA_VISUAL_USER_SELECTED" />',
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />'
          ]
          if 'android.permission.POST_NOTIFICATIONS' not in s:
              s = s.replace('<application', chr(10).join(permissions) + chr(10) + '    <application', 1)
          service = [
              '        <service android:name=".FocusTimerService" android:exported="false" android:foregroundServiceType="specialUse">',
              '            <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="Ongoing study focus timer with persistent notification" />',
              '        </service>'
          ]
          if 'FocusTimerService' not in s:
              s = s.replace('</application>', chr(10).join(service) + chr(10) + '    </application>', 1)
          p.write_text(s)
          PY
      - name: Install Focus Flow launcher icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#080b14" android:pathData="M0,0h108v108h-108z"/>
            <path android:strokeColor="#8b5cf6" android:strokeWidth="3" android:fillColor="#10132b" android:pathData="M54,12a34,34 0,1 0,0.1 0z"/>
            <path android:strokeColor="#22d3ee" android:strokeWidth="2" android:fillColor="#00000000" android:pathData="M54,16a30,30 0,1 0,0.1 0z"/>
            <path android:strokeColor="#ffffff" android:strokeWidth="4" android:strokeLineCap="round" android:pathData="M54,54L54,31 M54,54L70,42"/>
            <path android:fillColor="#d946ef" android:pathData="M58,54a4,4 0,1 1,-8 0a4,4 0,1 1,8 0"/>
            <path android:fillColor="#eef4ff" android:pathData="M23,78q15,-12 31,0q16,-12 31,0v13q-15,-10 -31,0q-16,-10 -31,0z"/>
            <path android:fillColor="#38f59a" android:pathData="M73,26l15,-8l-3,8l7,-1l-15,10l3,-8z"/>
          </vector>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <resources><color name="ic_launcher_background">#080b14</color></resources>
          EOF
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          import re
          s = re.sub(r'\\s+android:(?:roundIcon|icon)="[^"]*"', '', s)
          s = s.replace('<application', '<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"', 1)
          p.write_text(s)
          PY
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: focus-flow-4.0-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
