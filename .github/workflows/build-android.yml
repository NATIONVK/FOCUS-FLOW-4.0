name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify toolchain
        run: |
          java -version
          node --version
          npm --version
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Build web app
        run: npm run build
      - name: Add Android platform if absent
        run: |
          if [ ! -d android ]; then npx cap add android; fi
      - name: Install native gallery bridge
        run: |
          mkdir -p android/app/src/main/java/com/nationvk/focusflow
          cp native/android/GalleryPlugin.java android/app/src/main/java/com/nationvk/focusflow/GalleryPlugin.java
          cp native/android/FocusTimerPlugin.java android/app/src/main/java/com/nationvk/focusflow/FocusTimerPlugin.java
          cp native/android/FocusTimerService.java android/app/src/main/java/com/nationvk/focusflow/FocusTimerService.java
          cp native/android/MainActivity.java android/app/src/main/java/com/nationvk/focusflow/MainActivity.java
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />',
              '    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />',
              '    <uses-permission android:name="android.permission.READ_MEDIA_VISUAL_USER_SELECTED" />',
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />'
          ]
          if 'android.permission.POST_NOTIFICATIONS' not in s:
              s = s.replace('<application', chr(10).join(permissions) + chr(10) + '    <application', 1)
          service = [
              '        <service android:name=".FocusTimerService" android:exported="false" android:foregroundServiceType="specialUse">',
              '            <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="Ongoing study focus timer with persistent notification" />',
              '        </service>'
          ]
          if 'FocusTimerService' not in s:
              s = s.replace('</application>', chr(10).join(service) + chr(10) + '    </application>', 1)
          p.write_text(s)
          PY
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: focus-flow-4.0-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
