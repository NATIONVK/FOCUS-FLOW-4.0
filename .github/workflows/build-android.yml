name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

# Keep only the newest APK build for the main branch.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify toolchain
        run: |
          java -version
          node --version
          npm --version
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Build web app
        run: npm run build
      - name: Add Android platform if absent
        run: |
          if [ ! -d android ]; then npx cap add android; fi
      - name: Install native gallery bridge
        run: |
          mkdir -p android/app/src/main/java/com/nationvk/focusflow
          cp native/android/GalleryPlugin.java android/app/src/main/java/com/nationvk/focusflow/GalleryPlugin.java
          cp native/android/FocusTimerPlugin.java android/app/src/main/java/com/nationvk/focusflow/FocusTimerPlugin.java
          cp native/android/FocusTimerService.java android/app/src/main/java/com/nationvk/focusflow/FocusTimerService.java
          cp native/android/MainActivity.java android/app/src/main/java/com/nationvk/focusflow/MainActivity.java
      - name: Prepare Android manifest and launcher icons with Python
        run: python scripts/prepare_android.py android/app/src/main/AndroidManifest.xml android/app/src/main/res
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Generate release metadata and APK size report
        run: >-
          python scripts/release_manager.py
          --apk android/app/build/outputs/apk/debug/app-debug.apk
          --output release-report
      - name: Upload release report
        uses: actions/upload-artifact@v6
        with:
          name: focus-flow-release-report
          path: release-report/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: focus-flow-4.0-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
